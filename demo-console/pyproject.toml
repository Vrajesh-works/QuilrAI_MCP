[project]
name = "demo-console"
version = "0.1.0"
description = "Browser console for exercising the gateways"
readme = "README.md"
authors = [
    { name = "Vrajesh-works", email = "vnasit03@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_console"]
