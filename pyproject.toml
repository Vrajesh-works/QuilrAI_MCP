[tool.uv.workspace]
# Four services plus the demo console, one environment. Each member keeps its
# own pyproject and stays independently runnable; the workspace shares only the
# venv and the lockfile, so a single `uv sync` at the root installs everything.
members = [
    "mcp-server",
    "mcp-gateway",
    "llm-gateway-guardrail",
    "llm-gateway-router",
    "demo-console",
]

[tool.uv.sources]
customer-mcp = { workspace = true }
mcp-gateway = { workspace = true }
llm-guardrail = { workspace = true }
llm-router = { workspace = true }
demo-console = { workspace = true }

[dependency-groups]
# Listing the members here is what makes `uv sync` at the root install all of
# them into the shared environment.
dev = [
    "customer-mcp",
    "mcp-gateway",
    "llm-guardrail",
    "llm-router",
    "demo-console",
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
