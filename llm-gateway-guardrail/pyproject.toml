[project]
name = "llm-guardrail"
version = "0.1.0"
description = "LLM gateway with real-time streaming PII redaction"
readme = "README.md"
authors = [
    { name = "Vrajesh-works", email = "vnasit03@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "regex>=2026.9.3",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_guardrail", "src/mock_provider"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
